<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameTracker — Player History</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            felt: { DEFAULT: "#1f6b4a", dark: "#154f36", light: "#2d8a60" },
            wood: { DEFAULT: "#8b6914", deep: "#5c4510", muted: "#a8893a" },
            parchment: { DEFAULT: "#f3ebd8", deep: "#e8dcc4" },
            ink: { DEFAULT: "#1f1a14", muted: "#5c5348" },
            gold: { DEFAULT: "#c9a227", soft: "#f5e6b8" },
          },
          fontFamily: {
            display: ['"Fraunces"', "Georgia", "serif"],
            body: ['"Nunito"', "system-ui", "sans-serif"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/theme.css" />
  <script src="js/config.js"></script>
  <script src="https://browser.sentry-cdn.com/8.55.0/bundle.replay.min.js" crossorigin="anonymous"></script>
  <script src="js/sentry-init.js"></script>
</head>
<body class="gt-body font-body">
  <div class="gt-wood-strip"></div>
  <div class="mx-auto max-w-2xl px-4 py-10">
    <nav class="gt-nav mb-6 flex flex-wrap gap-x-4 gap-y-2 text-lg font-bold">
      <a href="index.html">Home</a>
      <a href="tournaments.html">Tournaments</a>
      <a href="games.html">Games</a>
      <a href="players.html">Players</a>
      <a href="teams.html">Teams</a>
      <a href="history.html">History</a>
    </nav>
    <header class="mb-8">
      <p class="gt-eyebrow">Game Tracker</p>
      <h1 class="gt-title mt-1 text-3xl font-semibold tracking-tight">Player History</h1>
      <p class="gt-subtitle mt-2">
        Standings across completed tournaments — tournament wins and game wins.
      </p>
      <div class="mt-4">
        <a href="history.html" class="gt-btn-secondary text-sm">Back to tournament history</a>
      </div>
    </header>

    <section class="gt-panel p-5">
      <h2 class="mb-4 font-display text-2xl font-semibold text-ink">Player standings</h2>
      <p id="list-status" class="mb-3 text-sm gt-muted">Loading player history…</p>
      <div id="standings-header" class="mb-2 hidden grid grid-cols-[minmax(0,1fr)_11rem_8.5rem] items-center gap-3 border-b border-wood/25 pb-2 text-lg font-bold uppercase tracking-wide text-ink">
        <span>Player</span>
        <button type="button" id="sort-tournament-wins" data-sort="tournamentWins" class="whitespace-nowrap text-right text-felt-dark underline hover:text-felt">
          Tournament wins
        </button>
        <button type="button" id="sort-game-wins" data-sort="gameWins" class="whitespace-nowrap text-right text-felt-dark underline hover:text-felt">
          Game wins
        </button>
      </div>
      <ul id="player-list" class="divide-y divide-wood/20"></ul>
      <p id="empty-state" class="hidden text-sm gt-muted">No players yet.</p>
    </section>
  </div>

  <script src="js/common.js" defer></script>
  <script src="js/play-winners.js" defer></script>
  <script src="js/player-history.js" defer></script>
</body>
</html>
