<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameTracker - Player History</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: "#F4F6F3",
            panel: { DEFAULT: "#FFFFFF", muted: "#EEF1EE" },
            line: "#D8DED8",
            accent: { DEFAULT: "#1B7A4E", soft: "#E3F3EA", dark: "#145C3A" },
            pop: { DEFAULT: "#C9A227", soft: "#F5E6B8" },
            felt: { DEFAULT: "#1B7A4E", dark: "#145C3A", light: "#2d9a64" },
            wood: { DEFAULT: "#D8DED8", deep: "#5E6B62", muted: "#C5CFC5" },
            parchment: { DEFAULT: "#FFFFFF", deep: "#EEF1EE" },
            ink: { DEFAULT: "#1A221C", muted: "#5E6B62" },
            gold: { DEFAULT: "#c9a227", soft: "#f5e6b8" },
          },
          fontFamily: {
            display: ['"Barlow Condensed"', "system-ui", "sans-serif"],
            body: ['"Inter"', "system-ui", "sans-serif"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/theme.css?v=20260827m" />
  <script src="js/config.js?v=20260811d"></script>
  <script src="https://browser.sentry-cdn.com/8.55.0/bundle.replay.min.js" crossorigin="anonymous"></script>
  <script src="js/sentry-init.js?v=20260811d"></script>
</head>
<body class="gt-body font-body">
  <div class="gt-accent-strip"></div>
  <div class="gt-page-chrome">
    <div class="mx-auto max-w-5xl px-4 py-3">
      <nav class="gt-nav">
        <a href="index.html">Home</a>
        <a href="tournaments.html">Tournaments</a>
        <a href="cornhole-tournament.html">Cornhole</a>
        <a href="games.html">Games</a>
        <a href="players.html">Players</a>
        <a href="teams.html">Teams</a>
        <a href="history.html" aria-current="page">History</a>
      </nav>
    </div>
  </div>
  <div class="mx-auto max-w-2xl px-4 py-10">
    <header class="gt-page-header">
      <p class="gt-eyebrow">Game Tracker</p>
      <h1 class="gt-title mt-1 text-3xl font-semibold tracking-tight">Player History</h1>
      <p class="gt-subtitle mt-2">
        Standings across completed tournaments - tournament wins and game wins.
      </p>
      <div class="mt-4">
        <a href="history.html" class="gt-btn-secondary text-sm">Back to tournament history</a>
      </div>
    </header>

    <section class="gt-panel p-5">
      <h2 class="mb-4 font-display text-2xl font-semibold text-ink">Player standings</h2>
      <p id="list-status" class="mb-3 text-sm gt-muted">Loading player history...</p>
      <div id="standings-header" class="mb-2 hidden grid grid-cols-[minmax(0,1fr)_5.5rem_5rem] items-center gap-2 border-b border-line pb-2 text-xs font-bold uppercase tracking-wide text-ink sm:grid-cols-[minmax(0,1fr)_11rem_8.5rem] sm:gap-3 sm:text-lg">
        <span class="min-w-0 break-words">Player</span>
        <button type="button" id="sort-tournament-wins" data-sort="tournamentWins" class="min-w-0 break-words whitespace-normal leading-tight text-right text-felt-dark underline hover:text-felt sm:whitespace-nowrap">
          Tournament wins
        </button>
        <button type="button" id="sort-game-wins" data-sort="gameWins" class="min-w-0 break-words whitespace-normal leading-tight text-right text-felt-dark underline hover:text-felt sm:whitespace-nowrap">
          Game wins
        </button>
      </div>
      <ul id="player-list" class="divide-y divide-line"></ul>
      <p id="empty-state" class="hidden text-sm gt-muted">No players yet.</p>
    </section>
  </div>

  <script src="js/common.js?v=20260811d" defer></script>
  <script src="js/play-winners.js?v=20260811d" defer></script>
  <script src="js/player-history.js?v=20260811d" defer></script>
</body>
</html>
