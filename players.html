<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameTracker - Players</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: "#F4F6F3",
            panel: { DEFAULT: "#FFFFFF", muted: "#EEF1EE" },
            line: "#D8DED8",
            accent: { DEFAULT: "#1B7A4E", soft: "#E3F3EA", dark: "#145C3A" },
            pop: { DEFAULT: "#C9A227", soft: "#F5E6B8" },
            felt: { DEFAULT: "#1B7A4E", dark: "#145C3A", light: "#2d9a64" },
            wood: { DEFAULT: "#D8DED8", deep: "#5E6B62", muted: "#C5CFC5" },
            parchment: { DEFAULT: "#FFFFFF", deep: "#EEF1EE" },
            ink: { DEFAULT: "#1A221C", muted: "#5E6B62" },
            gold: { DEFAULT: "#c9a227", soft: "#f5e6b8" },
          },
          fontFamily: {
            display: ['"Barlow Condensed"', "system-ui", "sans-serif"],
            body: ['"Inter"', "system-ui", "sans-serif"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/theme.css?v=20260827m" />
  <script src="js/config.js?v=20260812al"></script>
  <script src="https://browser.sentry-cdn.com/8.55.0/bundle.replay.min.js" crossorigin="anonymous"></script>
  <script src="js/sentry-init.js?v=20260812al"></script>
</head>
<body class="gt-body font-body">
  <div class="gt-accent-strip"></div>
  <div class="gt-page-chrome">
    <div class="mx-auto max-w-5xl px-4 py-3">
      <nav class="gt-nav">
        <a href="index.html">Home</a>
        <a href="tournaments.html">Tournaments</a>
        <a href="cornhole-tournament.html">Cornhole</a>
        <a href="games.html">Games</a>
        <a href="players.html" aria-current="page">Players</a>
        <a href="teams.html">Teams</a>
        <a href="history.html">History</a>
      </nav>
    </div>
  </div>
  <div class="mx-auto max-w-5xl px-4 py-10">
    <header class="gt-page-header">
      <p class="gt-eyebrow">Game Tracker</p>
      <h1 class="gt-title mt-1 text-3xl font-semibold tracking-tight">Players</h1>
      <p class="gt-subtitle mt-2">Add, edit, or remove players. Name is required; nickname is optional.</p>
    </header>

    <div class="grid gap-6 lg:grid-cols-2 lg:items-start">
      <section class="gt-panel p-5">
        <h2 id="form-title" class="mb-4 font-display text-lg font-semibold text-ink">Add player</h2>
        <form id="player-form" class="space-y-4" autocomplete="off" novalidate>
          <input type="hidden" id="player-id" value="" />
          <div>
            <label for="player-name" class="gt-label">Name <span class="text-red-600">*</span></label>
            <input
              id="player-name"
              name="gtPlayerName"
              type="text"
              required
              autocomplete="off"
              autocorrect="off"
              autocapitalize="words"
              spellcheck="false"
              data-lpignore="true"
              data-1p-ignore
              data-form-type="other"
              class="gt-input"
              placeholder="e.g. Alice"
            />
            <p id="name-error" class="mt-1 hidden text-sm text-red-600">Name is required.</p>
          </div>
          <div>
            <label for="player-nickname" class="gt-label">Nickname</label>
            <input
              id="player-nickname"
              name="gtPlayerNickname"
              type="text"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="words"
              spellcheck="false"
              data-lpignore="true"
              data-1p-ignore
              data-form-type="other"
              class="gt-input"
              placeholder="Optional"
            />
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <button type="submit" id="submit-btn" class="gt-btn text-sm">Add player</button>
            <button type="button" id="cancel-edit-btn" class="gt-btn-secondary hidden text-sm">Cancel</button>
            <button type="button" id="return-btn" class="gt-btn text-sm">Return</button>
          </div>
        </form>
        <p id="form-status" class="mt-3 hidden text-sm" role="status"></p>
      </section>

      <section class="gt-panel p-5">
        <h2 class="mb-4 font-display text-lg font-semibold text-ink">All players</h2>
        <p id="list-status" class="mb-3 text-sm gt-muted">Loading players...</p>
        <ul id="player-list" class="grid grid-cols-2 gap-3"></ul>
        <p id="empty-state" class="hidden text-sm gt-muted">No players yet.</p>
      </section>
    </div>
  </div>

  <script src="js/common.js?v=20260812al" defer></script>
  <script src="js/players.js?v=20260827m" defer></script>
</body>
</html>
