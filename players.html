<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameTracker — Players</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            felt: { DEFAULT: "#1f6b4a", dark: "#154f36", light: "#2d8a60" },
            wood: { DEFAULT: "#8b6914", deep: "#5c4510", muted: "#a8893a" },
            parchment: { DEFAULT: "#f3ebd8", deep: "#e8dcc4" },
            ink: { DEFAULT: "#1f1a14", muted: "#5c5348" },
            gold: { DEFAULT: "#c9a227", soft: "#f5e6b8" },
          },
          fontFamily: {
            display: ['"Fraunces"', "Georgia", "serif"],
            body: ['"Nunito"', "system-ui", "sans-serif"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/theme.css" />
  <script src="js/config.js"></script>
  <script src="https://browser.sentry-cdn.com/8.55.0/bundle.replay.min.js" crossorigin="anonymous"></script>
  <script src="js/sentry-init.js"></script>
</head>
<body class="gt-body font-body">
  <div class="gt-wood-strip"></div>
  <div class="mx-auto max-w-5xl px-4 py-10">
    <nav class="gt-nav mb-6 flex flex-wrap gap-x-4 gap-y-2 text-lg font-bold">
      <a href="index.html">Home</a>
      <a href="tournaments.html">Tournaments</a>
      <a href="games.html">Games</a>
      <a href="players.html">Players</a>
      <a href="history.html">History</a>
    </nav>
    <header class="mb-8">
      <p class="gt-eyebrow">Game Tracker</p>
      <h1 class="gt-title mt-1 text-3xl font-semibold tracking-tight">Players</h1>
      <p class="gt-subtitle mt-2">Add, edit, or remove players. Name is required; nickname is optional.</p>
    </header>

    <div class="grid gap-6 lg:grid-cols-2 lg:items-start">
      <section class="gt-panel p-5">
        <h2 class="mb-4 font-display text-lg font-semibold text-ink">All players</h2>
        <p id="list-status" class="mb-3 text-sm gt-muted">Loading players…</p>
        <ul id="player-list" class="divide-y divide-wood/20"></ul>
        <p id="empty-state" class="hidden text-sm gt-muted">No players yet.</p>
      </section>

      <section class="gt-panel p-5">
        <h2 id="form-title" class="mb-4 font-display text-lg font-semibold text-ink">Add player</h2>
        <form id="player-form" class="space-y-4" novalidate>
          <input type="hidden" id="player-id" value="" />
          <div>
            <label for="player-name" class="gt-label">Name <span class="text-red-600">*</span></label>
            <input
              id="player-name"
              name="name"
              type="text"
              required
              autocomplete="off"
              class="gt-input"
              placeholder="e.g. Alice"
            />
            <p id="name-error" class="mt-1 hidden text-sm text-red-600">Name is required.</p>
          </div>
          <div>
            <label for="player-nickname" class="gt-label">Nickname</label>
            <input
              id="player-nickname"
              name="nickname"
              type="text"
              autocomplete="off"
              class="gt-input"
              placeholder="Optional"
            />
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <button type="submit" id="submit-btn" class="gt-btn text-sm">Add player</button>
            <button type="button" id="cancel-edit-btn" class="gt-btn-secondary hidden text-sm">Cancel</button>
            <button type="button" id="return-btn" class="gt-btn hidden text-sm">Return</button>
          </div>
        </form>
        <p id="form-status" class="mt-3 hidden text-sm" role="status"></p>
      </section>
    </div>
  </div>

  <script src="js/common.js" defer></script>
  <script src="js/players.js" defer></script>
</body>
</html>
