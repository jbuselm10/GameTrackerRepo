<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameTracker — Games</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <div class="mx-auto max-w-5xl px-4 py-10">
    <nav class="mb-6 flex flex-wrap gap-x-4 gap-y-2 text-lg font-medium">
      <a href="index.html" class="text-slate-600 hover:text-slate-900">Home</a>
      <a href="tournaments.html" class="text-slate-600 hover:text-slate-900">Tournaments</a>

      <a href="games.html" class="text-slate-600 hover:text-slate-900">Games</a>
      <a href="players.html" class="text-slate-600 hover:text-slate-900">Players</a>
      <a href="history.html" class="text-slate-600 hover:text-slate-900">History</a>
    </nav>
    <header class="mb-8">
      <p class="text-sm font-medium uppercase tracking-wide text-slate-500">Game Tracker</p>
      <h1 class="mt-1 text-3xl font-semibold tracking-tight">Games</h1>
      <p class="mt-2 text-slate-600">Add, edit, or remove games. Name is required.</p>
    </header>

    <div class="grid gap-6 lg:grid-cols-2 lg:items-start">
      <section class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
        <h2 class="mb-4 text-lg font-medium">All games</h2>
        <p id="list-status" class="mb-3 text-sm text-slate-500">Loading games…</p>
        <ul id="game-list" class="divide-y divide-slate-100"></ul>
        <p id="empty-state" class="hidden text-sm text-slate-500">No games yet.</p>
      </section>

      <section class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
        <h2 id="form-title" class="mb-4 text-lg font-medium">Add game</h2>
        <form id="game-form" class="space-y-4" novalidate>
          <input type="hidden" id="game-id" value="" />
          <div>
            <label for="game-name" class="mb-1 block text-sm font-medium text-slate-700">Name <span class="text-red-600">*</span></label>
            <input
              id="game-name"
              name="name"
              type="text"
              required
              autocomplete="off"
              class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
              placeholder="e.g. Spades"
            />
            <p id="name-error" class="mt-1 hidden text-sm text-red-600">Name is required.</p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <button
              type="submit"
              id="submit-btn"
              class="rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800"
            >
              Add game
            </button>
            <button
              type="button"
              id="cancel-edit-btn"
              class="hidden rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
            >
              Cancel
            </button>
          </div>
        </form>
        <p id="form-status" class="mt-3 hidden text-sm" role="status"></p>
      </section>
    </div>
  </div>

  <script src="js/games.js" defer></script>
</body>
</html>
