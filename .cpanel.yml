---
# cPanel / GreenGeeks Git Version Control deploy.
# Clone this repo outside public_html (e.g. ~/repositories/GameTracker), then Deploy HEAD Commit.
# Site: https://gametracker.buselmeier.com → public_html/GameTracker/
deployment:
  tasks:
    - export DEPLOYPATH=/home/jbuse10/public_html/GameTracker/
    - /bin/cp -f index.html active-tournament.html games.html history.html player-history.html players.html tournament-summary.html tournaments.html favicon.png composer.json .htaccess $DEPLOYPATH
    - /bin/cp -Rf api css js $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATHdata
    - /bin/cp -f data/.htaccess $DEPLOYPATHdata/
    # Seed empty JSON only when missing — never overwrite live production data.
    - /usr/bin/test -f $DEPLOYPATHdata/players.json || /bin/printf '%s\n' '[]' > $DEPLOYPATHdata/players.json
    - /usr/bin/test -f $DEPLOYPATHdata/games.json || /bin/printf '%s\n' '[]' > $DEPLOYPATHdata/games.json
    - /usr/bin/test -f $DEPLOYPATHdata/tournaments.json || /bin/printf '%s\n' '[]' > $DEPLOYPATHdata/tournaments.json
