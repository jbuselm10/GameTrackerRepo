<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameTracker — Tournament History</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            felt: { DEFAULT: "#1f6b4a", dark: "#154f36", light: "#2d8a60" },
            wood: { DEFAULT: "#8b6914", deep: "#5c4510", muted: "#a8893a" },
            parchment: { DEFAULT: "#f3ebd8", deep: "#e8dcc4" },
            ink: { DEFAULT: "#1f1a14", muted: "#5c5348" },
            gold: { DEFAULT: "#c9a227", soft: "#f5e6b8" },
          },
          fontFamily: {
            display: ['"Fraunces"', "Georgia", "serif"],
            body: ['"Nunito"', "system-ui", "sans-serif"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/theme.css?v=20260804" />
  <script src="js/config.js?v=20260804"></script>
  <script src="https://browser.sentry-cdn.com/8.55.0/bundle.replay.min.js" crossorigin="anonymous"></script>
  <script src="js/sentry-init.js?v=20260804"></script>
</head>
<body class="gt-body font-body">
  <div class="gt-wood-strip"></div>
  <div class="mx-auto max-w-2xl px-4 py-10">
    <nav class="gt-nav mb-6 flex flex-wrap gap-x-4 gap-y-2 text-lg font-bold">
      <a href="index.html">Home</a>
      <a href="tournaments.html">Tournaments</a>
      <a href="games.html">Games</a>
      <a href="players.html">Players</a>
      <a href="teams.html">Teams</a>
      <a href="history.html">History</a>
    </nav>
    <header class="mb-8">
      <p class="gt-eyebrow">Game Tracker</p>
      <div class="mt-1 flex flex-wrap items-center justify-between gap-4">
        <h1 class="gt-title text-3xl font-semibold tracking-tight">Tournament History</h1>
        <a href="player-history.html" class="gt-btn-secondary ml-auto shrink-0 text-sm sm:ml-8">Player History</a>
      </div>
      <p class="gt-subtitle mt-2">
        Completed Tournaments will only be displayed.<br />
        If you do not see a tournament it may still be active.
      </p>
    </header>

    <section class="gt-panel p-5">
      <h2 class="mb-4 font-display text-lg font-semibold text-ink">Completed Tournaments</h2>
      <p id="action-status" class="mb-3 hidden text-sm" role="status"></p>
      <p id="list-status" class="mb-3 text-sm gt-muted">Loading history…</p>
      <div id="history-list" class="space-y-4"></div>
      <p id="empty-state" class="hidden text-sm gt-muted">No completed tournaments yet.</p>
    </section>
  </div>

  <script src="js/common.js?v=20260804" defer></script>
  <script src="js/play-winners.js?v=20260804" defer></script>
  <script src="js/history.js?v=20260804" defer></script>
</body>
</html>
