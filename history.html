<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameTracker — Tournament History</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <div class="mx-auto max-w-2xl px-4 py-10">
    <nav class="mb-6 flex flex-wrap gap-x-4 gap-y-2 text-lg font-medium">
      <a href="index.html" class="text-slate-600 hover:text-slate-900">Home</a>
      <a href="players.html" class="text-slate-600 hover:text-slate-900">Players</a>
      <a href="games.html" class="text-slate-600 hover:text-slate-900">Games</a>
      <a href="tournaments.html" class="text-slate-600 hover:text-slate-900">Tournaments</a>
    </nav>
    <header class="mb-8">
      <p class="text-sm font-medium uppercase tracking-wide text-slate-500">Game Tracker</p>
      <h1 class="mt-1 text-3xl font-semibold tracking-tight">Tournament History</h1>
      <p class="mt-2 text-slate-600">Ended tournaments only.</p>
    </header>

    <section class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
      <h2 class="mb-4 text-lg font-medium">Ended tournaments</h2>
      <p id="action-status" class="mb-3 hidden text-sm" role="status"></p>
      <p id="list-status" class="mb-3 text-sm text-slate-500">Loading history…</p>
      <ul id="history-list" class="divide-y divide-slate-100"></ul>
      <p id="empty-state" class="hidden text-sm text-slate-500">No ended tournaments yet.</p>
    </section>
  </div>

  <script src="js/history.js" defer></script>
</body>
</html>
