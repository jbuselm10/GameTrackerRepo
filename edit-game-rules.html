<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameTracker - Edit Game Rules</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: "#F4F6F3",
            panel: { DEFAULT: "#FFFFFF", muted: "#EEF1EE" },
            line: "#D8DED8",
            accent: { DEFAULT: "#1B7A4E", soft: "#E3F3EA", dark: "#145C3A" },
            pop: { DEFAULT: "#C9A227", soft: "#F5E6B8" },
            felt: { DEFAULT: "#1B7A4E", dark: "#145C3A", light: "#2d9a64" },
            wood: { DEFAULT: "#D8DED8", deep: "#5E6B62", muted: "#C5CFC5" },
            parchment: { DEFAULT: "#FFFFFF", deep: "#EEF1EE" },
            ink: { DEFAULT: "#1A221C", muted: "#5E6B62" },
            gold: { DEFAULT: "#c9a227", soft: "#f5e6b8" },
          },
          fontFamily: {
            display: ['"Barlow Condensed"', "system-ui", "sans-serif"],
            body: ['"Inter"', "system-ui", "sans-serif"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/theme.css?v=20260827m" />
  <script src="js/config.js?v=20260810"></script>
  <script src="https://browser.sentry-cdn.com/8.55.0/bundle.replay.min.js" crossorigin="anonymous"></script>
  <script src="js/sentry-init.js?v=20260810"></script>
</head>
<body class="gt-body font-body">
  <div class="gt-accent-strip"></div>
  <div class="gt-page-chrome">
    <div class="mx-auto max-w-5xl px-4 py-3">
      <nav class="gt-nav">
        <a href="index.html">Home</a>
        <a href="tournaments.html">Tournaments</a>
        <a href="cornhole-tournament.html">Cornhole</a>
        <a href="games.html" aria-current="page">Games</a>
        <a href="players.html">Players</a>
        <a href="teams.html">Teams</a>
        <a href="history.html">History</a>
      </nav>
    </div>
  </div>
  <div class="mx-auto max-w-2xl px-4 py-10">
    <header class="gt-page-header">
      <p class="gt-eyebrow">Game Tracker</p>
      <h1 id="page-title" class="gt-title mt-1 text-3xl font-semibold tracking-tight">Edit Rules</h1>
      <p class="gt-subtitle mt-2">Add or update the rules for this game.</p>
      <div class="mt-4 flex flex-wrap items-center gap-2">
        <button type="button" id="return-btn" class="gt-btn-secondary text-sm">Return</button>
      </div>
    </header>

    <p id="page-status" class="mb-4 text-sm gt-subtitle">Loading rules...</p>

    <section id="edit-panel" class="hidden">
      <div class="gt-panel p-5">
        <form id="rules-form" class="space-y-4" autocomplete="off" novalidate>
          <div>
            <label for="rules-text" class="gt-label">Rules</label>
            <textarea
              id="rules-text"
              name="gtGameRules"
              rows="14"
              class="gt-input min-h-[16rem]"
              placeholder="Enter the rules for this game'"
            ></textarea>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <button type="submit" id="save-btn" class="gt-btn text-sm">Save</button>
            <button type="button" id="cancel-btn" class="gt-btn-secondary text-sm">Return</button>
          </div>
        </form>
        <p id="form-status" class="mt-3 hidden text-sm" role="status"></p>
      </div>
    </section>
  </div>

  <script src="js/common.js?v=20260810" defer></script>
  <script src="js/edit-game-rules.js?v=20260810" defer></script>
</body>
</html>
