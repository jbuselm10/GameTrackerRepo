<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameTracker — Tournament Summary</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            felt: { DEFAULT: "#1f6b4a", dark: "#154f36", light: "#2d8a60" },
            wood: { DEFAULT: "#8b6914", deep: "#5c4510", muted: "#a8893a" },
            parchment: { DEFAULT: "#f3ebd8", deep: "#e8dcc4" },
            ink: { DEFAULT: "#1f1a14", muted: "#5c5348" },
            gold: { DEFAULT: "#c9a227", soft: "#f5e6b8" },
          },
          fontFamily: {
            display: ['"Fraunces"', "Georgia", "serif"],
            body: ['"Nunito"', "system-ui", "sans-serif"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/theme.css?v=20260804c" />
  <script src="js/config.js?v=20260804c"></script>
  <script src="https://browser.sentry-cdn.com/8.55.0/bundle.replay.min.js" crossorigin="anonymous"></script>
  <script src="js/sentry-init.js?v=20260804c"></script>
</head>
<body class="gt-body font-body">
  <div class="gt-wood-strip"></div>
  <div class="mx-auto max-w-2xl px-4 py-10">
    <nav class="gt-nav mb-6 flex flex-wrap gap-x-4 gap-y-2 text-lg font-bold">
      <a href="index.html">Home</a>
      <a href="tournaments.html">Tournaments</a>
      <a href="games.html">Games</a>
      <a href="players.html">Players</a>
      <a href="teams.html">Teams</a>
      <a href="history.html">History</a>
    </nav>
    <header class="mb-8">
      <p class="gt-eyebrow">Game Tracker</p>
      <h1 class="gt-title mt-1 text-3xl font-semibold tracking-tight">Tournament Summary</h1>
      <p id="summary-subtitle" class="gt-subtitle mt-2">Results ranked by wins.</p>
      <div class="mt-4">
        <button type="button" id="return-btn" class="gt-btn-secondary text-sm">Return</button>
      </div>
    </header>

    <p id="page-status" class="mb-4 text-sm gt-subtitle">Loading summary…</p>

    <section id="summary-panel" class="hidden space-y-6">
      <div class="gt-panel p-5">
        <h2 id="tournament-name" class="font-display text-lg font-semibold text-ink"></h2>
        <p id="tournament-meta" class="mt-1 text-sm gt-muted"></p>
        <p id="games-played" class="mt-2 text-sm text-ink"></p>
      </div>

      <div id="top-winners" class="gt-top-winners hidden p-5">
        <h2 class="text-sm font-bold uppercase tracking-wide text-wood-deep">Top by wins</h2>
        <p id="top-winners-text" class="mt-2 text-lg font-semibold text-wood-deep"></p>
      </div>

      <div class="gt-panel p-5">
        <h2 class="mb-4 font-display text-lg font-semibold text-ink">Standings</h2>
        <ol id="standings-list" class="space-y-3"></ol>
        <p id="standings-empty" class="hidden text-sm gt-muted">No players on this tournament.</p>
      </div>
    </section>
  </div>

  <script src="js/common.js?v=20260804c" defer></script>
  <script src="js/play-winners.js?v=20260804c" defer></script>
  <script src="js/tournament-summary.js?v=20260804c" defer></script>
</body>
</html>
