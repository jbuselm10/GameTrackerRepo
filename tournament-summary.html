<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameTracker — Tournament Summary</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <div class="mx-auto max-w-2xl px-4 py-10">
    <nav class="mb-6 flex flex-wrap gap-x-4 gap-y-2 text-lg font-medium">
      <a href="index.html" class="text-slate-600 hover:text-slate-900">Home</a>
      <a href="tournaments.html" class="text-slate-600 hover:text-slate-900">Tournaments</a>

      <a href="games.html" class="text-slate-600 hover:text-slate-900">Games</a>
      <a href="players.html" class="text-slate-600 hover:text-slate-900">Players</a>
      <a href="history.html" class="text-slate-600 hover:text-slate-900">History</a>
    </nav>
    <header class="mb-8">
      <p class="text-sm font-medium uppercase tracking-wide text-slate-500">Game Tracker</p>
      <h1 class="mt-1 text-3xl font-semibold tracking-tight">Tournament Summary</h1>
      <p id="summary-subtitle" class="mt-2 text-slate-600">Results ranked by wins.</p>
      <div class="mt-4">
        <a
          href="history.html"
          class="inline-block rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
        >
          Back to history
        </a>
      </div>
    </header>

    <p id="page-status" class="mb-4 text-sm text-slate-500">Loading summary…</p>

    <section id="summary-panel" class="hidden space-y-6">
      <div class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
        <h2 id="tournament-name" class="text-lg font-medium"></h2>
        <p id="tournament-meta" class="mt-1 text-sm text-slate-500"></p>
        <p id="games-played" class="mt-2 text-sm text-slate-600"></p>
      </div>

      <div id="top-winners" class="hidden rounded-lg border border-emerald-200 bg-emerald-50 p-5">
        <h2 class="text-sm font-medium uppercase tracking-wide text-emerald-800">Top by wins</h2>
        <p id="top-winners-text" class="mt-2 text-lg font-semibold text-emerald-900"></p>
      </div>

      <div class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
        <h2 class="mb-4 text-lg font-medium">Standings</h2>
        <ol id="standings-list" class="space-y-3"></ol>
        <p id="standings-empty" class="hidden text-sm text-slate-500">No players on this tournament.</p>
      </div>
    </section>
  </div>

  <script src="js/tournament-summary.js" defer></script>
</body>
</html>
